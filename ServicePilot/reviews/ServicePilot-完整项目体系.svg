<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2270" viewBox="0 0 1400 2270" role="img"><title>ServicePilot 完整项目体系</title><desc>从 Streamlit 到会话应用层、Runner、DeepSeek、三个 Agent、本地工具与模拟资料，再返回页面；包括配置、日志、异常、人工边界和评测。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#768f82" stroke-width="1.8"/></marker><marker id="arrSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#768f82" stroke-width="1.8"/></marker></defs><rect width="1400" height="2270" fill="#f8faf7"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="60" y="64" font-size="38" fill="#182e3b" font-weight="700" text-anchor="start">ServicePilot｜完整项目体系图</text><text x="60" y="106" font-size="24" fill="#52656e" font-weight="400" text-anchor="start">基于你的原图展开：界面 → 会话 → Agent 工作流 → 工具 → 数据 → 答复返回。</text><text x="60" y="139" font-size="22" fill="#94621e" font-weight="400" text-anchor="start">目标设计，电商功能待实现；已完成的是环境、DeepSeek 接入与航空基线学习。</text><rect x="220" y="185" width="640" height="125" rx="20" fill="#f3eff9" stroke="#9277b4" stroke-width="2"/><text x="540" y="224" font-size="29" fill="#182e3b" font-weight="700" text-anchor="middle">① Streamlit 聊天界面 · P1</text><text x="540" y="261" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">用户问题 / 客服答复 / 新会话 / 实际执行事件</text><text x="540" y="293" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">显示模拟标识；页面不自行编订单事实</text><path d="M540 310 V365" stroke="#849d91" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="140" y="365" width="800" height="150" rx="20" fill="#edf3ff" stroke="#4a82d2" stroke-width="2"/><text x="540" y="404" font-size="29" fill="#182e3b" font-weight="700" text-anchor="middle">② 会话与应用入口 · Python</text><text x="540" y="441" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">会话标识 + 请求标识 + items 历史 + 当前 Agent</text><text x="540" y="473" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">新会话清空旧上下文；补充信息与更正编号可接续</text><text x="540" y="505" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">先管理输入，再交 Runner；无需强行拆成多个服务</text><path d="M540 515 V580" stroke="#849d91" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="65" y="580" width="950" height="605" rx="24" fill="#ffffff" stroke="#92b9aa" stroke-width="2"/><text x="100" y="625" font-size="30" fill="#167361" font-weight="700" text-anchor="start">③ Agents SDK / Runner：编排与执行</text><text x="100" y="667" font-size="22" fill="#52656e" font-weight="400" text-anchor="start">提供当前角色配置 → 请求模型 → 执行交接 / 工具 → 必要时继续请求</text><rect x="350" y="713" width="390" height="113" rx="20" fill="#edf3ff" stroke="#4a82d2" stroke-width="2"/><text x="545" y="752" font-size="29" fill="#182e3b" font-weight="700" text-anchor="middle">Triage Agent</text><text x="545" y="789" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">识别请求，决定交给谁</text><path d="M440 826 V867 H295 V920" stroke="#167361" stroke-width="3" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/><path d="M650 826 V867 H735 V920" stroke="#167361" stroke-width="3" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="295" y="900" font-size="22" fill="#167361" font-weight="400" text-anchor="middle">FAQ ↔ Triage</text><text x="735" y="900" font-size="22" fill="#167361" font-weight="400" text-anchor="middle">Order ↔ Triage</text><rect x="135" y="920" width="320" height="140" rx="20" fill="#e8f6f0" stroke="#167361" stroke-width="2"/><text x="295" y="959" font-size="27" fill="#182e3b" font-weight="700" text-anchor="middle">FAQ Agent</text><text x="295" y="996" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">模拟政策 / 退货规则</text><text x="295" y="1028" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">请求 FAQ 查询工具</text><rect x="575" y="920" width="320" height="140" rx="20" fill="#e8f6f0" stroke="#167361" stroke-width="2"/><text x="735" y="959" font-size="27" fill="#182e3b" font-weight="700" text-anchor="middle">Order Agent</text><text x="735" y="996" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">订单 / 物流 / 售后咨询</text><text x="735" y="1028" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">缺订单号先追问</text><text x="540" y="1114" font-size="23" fill="#52656e" font-weight="400" text-anchor="middle">三个角色可以共用同一 DeepSeek 模型；不是 SDK Agent。</text><text x="540" y="1152" font-size="22" fill="#52656e" font-weight="400" text-anchor="middle">双向线：建议的内部交接；最终答复才结束本轮。</text><path d="M295 1060 V1082 H110 V1210 H295 V1240" stroke="#849d91" stroke-width="3" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/><path d="M735 1060 V1082 H960 V1210 H735 V1240" stroke="#849d91" stroke-width="3" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/><rect x="135" y="1240" width="320" height="132" rx="20" fill="#f1f4f3" stroke="#a7b7b0" stroke-width="2"/><text x="295" y="1279" font-size="27" fill="#182e3b" font-weight="700" text-anchor="middle">④ lookup_faq</text><text x="295" y="1316" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">Python 工具；查模拟政策</text><text x="295" y="1348" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">返回状态、内容与政策编号</text><rect x="575" y="1240" width="320" height="132" rx="20" fill="#f1f4f3" stroke="#a7b7b0" stroke-width="2"/><text x="735" y="1279" font-size="27" fill="#182e3b" font-weight="700" text-anchor="middle">④ query_order</text><text x="735" y="1316" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">Python 工具；规范化订单号</text><text x="735" y="1348" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">校验格式，查模拟记录</text><path d="M295 1372 V1450" stroke="#849d91" stroke-width="3" fill="none" marker-end="url(#arr)" marker-start="url(#arr)" stroke-dasharray="8 6"/><path d="M735 1372 V1450" stroke="#849d91" stroke-width="3" fill="none" marker-end="url(#arr)" marker-start="url(#arr)" stroke-dasharray="8 6"/><rect x="135" y="1450" width="320" height="165" rx="20" fill="#f1f4f3" stroke="#a7b7b0" stroke-width="2"/><text x="295" y="1489" font-size="27" fill="#182e3b" font-weight="700" text-anchor="middle">⑤ 本地 FAQ 数据</text><text x="295" y="1526" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">模拟退货规则等政策</text><text x="295" y="1558" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">查不到：no_match</text><text x="295" y="1590" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">未定义规则不能编造</text><rect x="575" y="1450" width="320" height="165" rx="20" fill="#f1f4f3" stroke="#a7b7b0" stroke-width="2"/><text x="735" y="1489" font-size="27" fill="#182e3b" font-weight="700" text-anchor="middle">⑤ 模拟订单 JSON</text><text x="735" y="1526" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">A1001 / A1002 / A1003</text><text x="735" y="1558" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">业务事实由数据提供</text><text x="735" y="1590" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">历史记录不能充当订单库</text><path d="M540 1185 V1690" stroke="#849d91" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="540" y="1653" font-size="22" fill="#167361" font-weight="700" text-anchor="middle">最终结果返回</text><rect x="140" y="1690" width="800" height="153" rx="20" fill="#edf3ff" stroke="#4a82d2" stroke-width="2"/><text x="540" y="1729" font-size="29" fill="#182e3b" font-weight="700" text-anchor="middle">⑥ 答复与事件回到应用，再回到界面</text><text x="540" y="1766" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">工具结果 → 模型据实答复 → 入口接收最终结果</text><text x="540" y="1798" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">保存对话与当前 Agent；展示实际工具 / 交接事件</text><text x="540" y="1830" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">追问或完成后等待用户下一题，不持续自动调用模型</text><path d="M140 1765 H25 V246 H220" stroke="#167361" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="45" y="1630" font-size="22" fill="#167361" font-weight="700" text-anchor="start">回到页面</text><text x="540" y="1902" font-size="24" fill="#182e3b" font-weight="700" text-anchor="middle">主链：界面与应用 → Runner / Agent → 工具与数据 → 最终答复回到页面</text><rect x="1040" y="185" width="320" height="265" rx="20" fill="#f1f4f3" stroke="#a7b7b0" stroke-width="2"/><text x="1200" y="224" font-size="27" fill="#182e3b" font-weight="700" text-anchor="middle">运行与配置</text><text x="1200" y="261" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">Python + 项目 .venv</text><text x="1200" y="293" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">依赖与版本记录</text><text x="1200" y="325" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">API 密钥留在服务端</text><text x="1200" y="357" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">服务地址与模型名</text><text x="1200" y="389" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">支撑整个应用</text><path d="M1040 416 H940" stroke="#849d91" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 6"/><rect x="1040" y="580" width="320" height="207" rx="20" fill="#edf3ff" stroke="#4a82d2" stroke-width="2"/><text x="1200" y="619" font-size="27" fill="#182e3b" font-weight="700" text-anchor="middle">DeepSeek API</text><text x="1200" y="656" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">远端生成与决策</text><text x="1200" y="688" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">共享模型，不同角色配置</text><text x="1200" y="720" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">返回交接 / 工具请求 / 答复</text><text x="1200" y="752" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">航空基线接入已验证</text><path d="M1015 715 H1040" stroke="#849d91" stroke-width="3" fill="none" marker-end="url(#arrSmall)" marker-start="url(#arrSmall)"/><rect x="1040" y="875" width="320" height="266" rx="20" fill="#f1f4f3" stroke="#a7b7b0" stroke-width="2"/><text x="1200" y="914" font-size="27" fill="#182e3b" font-weight="700" text-anchor="middle">事件与诊断</text><text x="1200" y="951" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">记录实际 Agent 交接</text><text x="1200" y="983" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">工具输入、状态与结果摘要</text><text x="1200" y="1015" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">请求所属会话、耗时</text><text x="1200" y="1047" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">有 usage 才报告成本</text><text x="1200" y="1079" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">不显示密钥或私有推理</text><path d="M1015 1010 H1040" stroke="#849d91" stroke-width="3" fill="none" marker-end="url(#arr)" stroke-dasharray="8 6"/><rect x="1040" y="1240" width="320" height="309" rx="20" fill="#fff5e3" stroke="#b78942" stroke-width="2"/><text x="1200" y="1279" font-size="27" fill="#182e3b" font-weight="700" text-anchor="middle">异常与 P0 人工边界</text><text x="1200" y="1316" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">格式错 ≠ 查无记录</text><text x="1200" y="1348" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">工具失败 ≠ 模型连接失败</text><text x="1200" y="1380" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">政策无依据：明确说明</text><text x="1200" y="1412" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">退款：需人工审核</text><text x="1200" y="1444" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">只建议联系人工</text><text x="1200" y="1476" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">没有真实人工通道</text><text x="1200" y="1508" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">不声称已退款 / 已建工单</text><rect x="1040" y="1650" width="320" height="277" rx="20" fill="#f3eff9" stroke="#9277b4" stroke-width="2" stroke-dasharray="8 6"/><text x="1200" y="1689" font-size="27" fill="#182e3b" font-weight="700" text-anchor="middle">P1 · 模拟工单扩展</text><text x="1200" y="1726" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">尚未实现，非真实人工接入</text><text x="1200" y="1758" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">用户确认订单号与摘要</text><text x="1200" y="1790" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">→ create_mock_ticket</text><text x="1200" y="1822" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">→ 工具校验确认与去重</text><text x="1200" y="1854" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">→ 返回模拟工单编号</text><text x="1200" y="1886" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">不直接执行退款</text><rect x="80" y="2000" width="1280" height="200" rx="20" fill="#f1f4f3" stroke="#a7b7b0" stroke-width="2"/><text x="720" y="2039" font-size="29" fill="#182e3b" font-weight="700" text-anchor="middle">项目验收与持续改进：支撑整个体系，不是另一个客服 Agent</text><text x="720" y="2076" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">先完成 8 条核心案例 → 后续扩充 25 条评测（15 开发 / 10 留出）</text><text x="720" y="2108" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">核对事实、路由、工具状态、多轮接续、会话隔离与越权边界；记录版本与真实结果</text><text x="720" y="2140" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">当前：案例已定义，电商尚未实测；不把设计图或航空成功当作电商验收通过</text><text x="720" y="2172" font-size="24" fill="#52656e" font-weight="400" text-anchor="middle">环境 / 模型 → C 最小订单改造 → D 核心闭环 → E 页面与作品展示</text><text x="700" y="2243" font-size="22" fill="#52656e" font-weight="400" text-anchor="middle">实线：主要调用 / 返回与交接；虚线：数据访问或支撑关系。所有电商组件均为目标设计。</text></g></svg>