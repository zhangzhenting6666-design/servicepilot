<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1390" viewBox="0 0 1200 1390" role="img"><title>图 A｜今天航空实例：谁负责什么</title><desc>真实航空示例的角色、SDK调度、本地工具与远端同一DeepSeek模型的关系</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#768d84" stroke-width="1.7"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#768d84" stroke-width="1.7"/></marker></defs><rect width="1200" height="1390" fill="#f8faf7"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="60" y="65" font-size="34" fill="#182e3b" font-weight="700" text-anchor="start">图 A｜今天航空实例：谁负责什么</text><text x="60" y="105" font-size="22" fill="#52656e" font-weight="400" text-anchor="start">按已运行代码整理；不是后续电商目标图，也不是每一轮必走的路径。</text><rect x="355" y="145" width="490" height="98" rx="20" fill="#f1f4f3" stroke="#acbcb5" stroke-width="2"/><text x="600" y="181" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">你在终端输入问题</text><text x="600" y="212" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">PowerShell 启动 Python 程序</text><path d="M600 243 V285" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="90" y="285" width="1020" height="145" rx="20" fill="#eaf1ff" stroke="#3a80db" stroke-width="2"/><text x="600" y="321" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">入口程序 + Agents SDK / Runner</text><text x="600" y="352" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">入口保存问题与历史；Runner 调用模型、执行工具和交接</text><text x="600" y="383" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">新会话：Triage  ·  连续会话：上轮最后的 Agent</text><text x="600" y="468" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">下面是可用角色；当前处理者可以是其中任何一个</text><rect x="390" y="495" width="420" height="112" rx="20" fill="#eaf1ff" stroke="#3a80db" stroke-width="2"/><text x="600" y="531" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">Triage Agent｜分流</text><text x="600" y="562" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">按请求选择可交接的角色</text><path d="M480 607 V647 H305 V700" stroke="#167361" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M720 607 V647 H895 V700" stroke="#167361" stroke-width="3" fill="none" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="305" y="680" font-size="19" fill="#167361" font-weight="400" text-anchor="middle">可转入，也可转回 Triage</text><text x="895" y="680" font-size="19" fill="#167361" font-weight="400" text-anchor="middle">可转入，也可转回 Triage</text><rect x="90" y="700" width="430" height="112" rx="20" fill="#e9f6f0" stroke="#167361" stroke-width="2"/><text x="305" y="736" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">FAQ Agent｜航空常见问题</text><text x="305" y="767" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">按说明请求查询工具</text><rect x="680" y="700" width="430" height="112" rx="20" fill="#e9f6f0" stroke="#167361" stroke-width="2"/><text x="895" y="736" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">Seat Booking Agent｜选座</text><text x="895" y="767" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">追问确认号与希望的座位</text><path d="M305 812 V867" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M895 812 V867" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="600" y="842" font-size="20" fill="#52656e" font-weight="400" text-anchor="middle">工具由 Runner 执行</text><rect x="90" y="867" width="430" height="99" rx="20" fill="#f1f4f3" stroke="#acbcb5" stroke-width="2"/><text x="305" y="903" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">faq_lookup_tool(question)</text><text x="305" y="934" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">返回本地示例资料</text><rect x="680" y="867" width="430" height="99" rx="20" fill="#f1f4f3" stroke="#acbcb5" stroke-width="2"/><text x="895" y="903" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">update_seat(...)</text><text x="895" y="934" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">更新会话中的确认号与座位</text><path d="M305 966 V1010" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M895 966 V1010" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="90" y="1010" width="430" height="110" rx="20" fill="#f1f4f3" stroke="#acbcb5" stroke-width="2"/><text x="305" y="1046" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">资料写在 Python 函数里</text><text x="305" y="1077" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">行李 / 座位 / Wi-Fi 关键词分支</text><text x="305" y="1108" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">不是联网搜索，也不是 RAG</text><rect x="680" y="1010" width="430" height="110" rx="20" fill="#f1f4f3" stroke="#acbcb5" stroke-width="2"/><text x="895" y="1046" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">本地 AirlineAgentContext</text><text x="895" y="1077" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">使用模拟航班号；未接航空系统</text><text x="895" y="1108" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">今天只追问，未实测完成选座</text><rect x="90" y="1180" width="1020" height="110" rx="20" fill="#eaf1ff" stroke="#3a80db" stroke-width="2"/><text x="600" y="1216" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">远端 DeepSeek API｜同一个 deepseek-flash</text><text x="600" y="1247" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">三个 Agent 都通过 Runner 使用它，只是工作说明与工具不同</text><text x="600" y="1278" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">它生成答复、提出工具调用或交接；Runner 在本机落实</text><text x="600" y="1334" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">绿色双向线：允许的 handoff；灰色下行线：工具与资料 / 操作关系。</text><text x="600" y="1367" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">没有 SDK Agent、Order Agent 或人工客服；这些名称不要混在当前样例里。</text></g></svg>