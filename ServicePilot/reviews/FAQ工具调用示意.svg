<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1310" viewBox="0 0 1160 1310" role="img" aria-labelledby="title desc"><title id="title">FAQ 工具的位置与调用流程</title><desc id="desc">模型按照 FAQ 指令提出调用 faq_lookup_tool，Runner 执行本地 Python 函数，将结果交回模型组织回答。右侧给出实际代码定义与绑定位置，并区分规划图和当前实现。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#749c91"/></marker></defs><rect width="1160" height="1310" fill="#f5f3ee"/><g font-family="Microsoft YaHei, sans-serif"><text x="55" y="59" font-size="35" fill="#183441" font-weight="700">FAQ 的工具在哪里？</text><text x="55" y="95" font-size="21" fill="#62757b" font-weight="400">今天的航空示例：代码提供工具，模型请求调用，Runner 执行。</text><rect x="55" y="130" width="620" height="95" rx="18" fill="#fff" stroke="#d4dfdc" stroke-width="2"/><text x="80" y="165" font-size="24" fill="#183441" font-weight="700">1  你问：行李能带多少？</text><text x="80" y="196" font-size="19" fill="#213947" font-weight="400">新会话由 Triage 分流到 FAQ；同一会话可接续当前 Agent。</text><path d="M365 225 V264" stroke="#749c91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="270" width="620" height="116" rx="18" fill="#e7f3ef" stroke="#2b927d" stroke-width="2"/><text x="80" y="305" font-size="24" fill="#183441" font-weight="700">2  FAQ Agent：有工作说明，也有工具清单</text><text x="80" y="336" font-size="19" fill="#213947" font-weight="400">说明：查 FAQ 工具，不依赖模型自身知识。</text><text x="80" y="362" font-size="19" fill="#213947" font-weight="400">清单：tools = [faq_lookup_tool]</text><path d="M365 386 V436" stroke="#749c91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="442" width="620" height="116" rx="18" fill="#fff5e3" stroke="#cfab67" stroke-width="2"/><text x="80" y="477" font-size="24" fill="#183441" font-weight="700">3  模型提出“调用请求”</text><text x="80" y="508" font-size="19" fill="#213947" font-weight="400">工具名：faq_lookup_tool</text><text x="80" y="534" font-size="19" fill="#213947" font-weight="400">参数示意：question = "baggage allowance"</text><path d="M365 558 V608" stroke="#749c91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="614" width="620" height="116" rx="18" fill="#eaf0f8" stroke="#8cacc9" stroke-width="2"/><text x="80" y="649" font-size="24" fill="#183441" font-weight="700">4  Runner / SDK：在你的电脑上执行</text><text x="80" y="680" font-size="19" fill="#213947" font-weight="400">把工具名对应到已绑定的 Python 函数。</text><text x="80" y="706" font-size="19" fill="#213947" font-weight="400">传入模型给出的参数，运行该函数。</text><path d="M365 730 V780" stroke="#749c91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="786" width="620" height="116" rx="18" fill="#e7f3ef" stroke="#2b927d" stroke-width="2"/><text x="80" y="821" font-size="24" fill="#183441" font-weight="700">5  本地工具：faq_lookup_tool(question)</text><text x="80" y="852" font-size="19" fill="#213947" font-weight="400">函数按英文关键词匹配，返回代码中写好的示例资料。</text><text x="80" y="878" font-size="19" fill="#213947" font-weight="400">行李、座位、Wi-Fi 是一个函数内的不同分支。</text><path d="M365 902 V952" stroke="#749c91" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="390" y="934" font-size="17" fill="#54786d" font-weight="400">工具结果回给模型</text><rect x="55" y="958" width="620" height="116" rx="18" fill="#fff" stroke="#d4dfdc" stroke-width="2"/><text x="80" y="993" font-size="24" fill="#183441" font-weight="700">6  FAQ 模型根据工具结果组织回答</text><text x="80" y="1024" font-size="19" fill="#213947" font-weight="400">工具提供资料；模型负责自然语言表达。</text><text x="80" y="1050" font-size="19" fill="#213947" font-weight="400">随后程序显示回答，保存历史与当前 Agent。</text><rect x="720" y="130" width="385" height="330" rx="18" fill="#183441"/><text x="744" y="167" font-size="22" fill="#fff" font-weight="700">代码位置 ①：定义工具</text><text x="744" y="203" font-size="18" fill="#b9d8ce" font-weight="400">main.py 第 43–70 行</text><text x="744" y="248" font-size="21" fill="#e3efe9" font-weight="400">@tool(...)</text><text x="744" y="285" font-size="19" fill="#e3efe9" font-weight="400">async def faq_lookup_tool(</text><text x="744" y="315" font-size="19" fill="#e3efe9" font-weight="400">    question: str</text><text x="744" y="345" font-size="19" fill="#e3efe9" font-weight="400">) -&gt; str:</text><text x="744" y="396" font-size="18" fill="#b9d8ce" font-weight="400">作用：输入问题，返回资料。</text><text x="744" y="428" font-size="18" fill="#b9d8ce" font-weight="400">不是另一个 Agent。</text><rect x="720" y="482" width="385" height="200" rx="18" fill="#fff" stroke="#d4dfdc" stroke-width="2"/><text x="744" y="521" font-size="22" fill="#183441" font-weight="700">代码位置 ②：绑定给 FAQ</text><text x="744" y="559" font-size="18" fill="#62757b" font-weight="400">main.py 第 125 行</text><text x="744" y="606" font-size="21" fill="#167361" font-weight="700">tools=[faq_lookup_tool]</text><text x="744" y="649" font-size="17" fill="#62757b" font-weight="400">只配置了一个 FAQ 业务查询工具。</text><rect x="720" y="706" width="385" height="226" rx="18" fill="#fff" stroke="#d4dfdc" stroke-width="2"/><text x="744" y="745" font-size="22" fill="#183441" font-weight="700">为什么没看到它？</text><text x="744" y="786" font-size="19" fill="#213947" font-weight="400">它是一段 Python 函数，</text><text x="744" y="817" font-size="19" fill="#213947" font-weight="400">不是需要手动打开的软件。</text><text x="744" y="858" font-size="18" fill="#62757b" font-weight="400">终端当时显示过：</text><text x="744" y="890" font-size="18" fill="#167361" font-weight="400">FAQ Agent 调用工具：</text><text x="744" y="918" font-size="19" fill="#167361" font-weight="700">faq_lookup_tool</text><rect x="720" y="958" width="385" height="245" rx="18" fill="#fff5e3" stroke="#dcc39a" stroke-width="2"/><text x="744" y="997" font-size="22" fill="#183441" font-weight="700">对应你图二中的哪个框？</text><text x="744" y="1038" font-size="18" fill="#213947" font-weight="400">search_faq()：未来电商规划名。</text><text x="744" y="1071" font-size="17" fill="#213947" font-weight="400">faq_lookup_tool：今天实际工具名。</text><text x="744" y="1111" font-size="19" fill="#94621e" font-weight="700">位置都在 FAQ Agent 下面。</text><text x="744" y="1150" font-size="17" fill="#62757b" font-weight="400">今天资料是代码里的字符串；</text><text x="744" y="1180" font-size="17" fill="#62757b" font-weight="400">尚未做订单 JSON 查询或 Web UI。</text><text x="55" y="1136" font-size="23" fill="#167361" font-weight="700">① 写函数 → ② tools 绑定 → ③ 模型请求 → ④ Runner 执行</text><text x="55" y="1180" font-size="19" fill="#62757b" font-weight="400">左侧表示处理顺序，不表示模型指挥程序跳到某个代码行号。</text><text x="55" y="1258" font-size="18" fill="#62757b" font-weight="400">示意图：参数用于教学，不是当次工具调用日志；行李资料仅属于航空样例。</text></g></svg>