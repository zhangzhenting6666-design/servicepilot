<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1430" viewBox="0 0 1200 1430" role="img"><title>图 B｜Runner 怎样运行一轮问题</title><desc>模型请求、交接、工具执行与最终答复的循环，以及多轮接续</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#768d84" stroke-width="1.7"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#768d84" stroke-width="1.7"/></marker></defs><rect width="1200" height="1430" fill="#f8faf7"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="60" y="65" font-size="34" fill="#182e3b" font-weight="700" text-anchor="start">图 B｜Runner 怎样运行一轮问题</text><text x="60" y="105" font-size="22" fill="#52656e" font-weight="400" text-anchor="start">一轮问题可以循环请求多次模型；不是每经过一个 Agent 只请求一次。</text><rect x="370" y="150" width="460" height="116" rx="20" fill="#f1f4f3" stroke="#acbcb5" stroke-width="2"/><text x="600" y="186" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">入口收到用户输入</text><text x="600" y="217" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">追加到 items，选择 current_agent</text><text x="600" y="248" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">新会话 Triage / 下轮 last_agent</text><path d="M600 266 V320" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="370" y="320" width="460" height="125" rx="20" fill="#eaf1ff" stroke="#3a80db" stroke-width="2"/><text x="600" y="356" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">Runner 请求 DeepSeek 模型</text><text x="600" y="387" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">提供当前 Agent 配置与对话信息</text><text x="600" y="418" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">每经过这里一次：模型请求数 +1</text><path d="M600 445 V495" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="370" y="495" width="460" height="90" rx="20" fill="#f1f4f3" stroke="#acbcb5" stroke-width="2"/><text x="600" y="531" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">模型输出了什么？</text><text x="600" y="562" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">Runner 按下面三类结果处理</text><path d="M600 585 V625 H215 V680" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M600 585 V680" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M600 585 V625 H985 V680" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="680" width="320" height="128" rx="20" fill="#e9f6f0" stroke="#167361" stroke-width="2"/><text x="215" y="716" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">A. handoff 请求</text><text x="215" y="747" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">切换 current_agent</text><text x="215" y="778" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">例：Triage → FAQ</text><rect x="440" y="680" width="320" height="128" rx="20" fill="#e9f6f0" stroke="#167361" stroke-width="2"/><text x="600" y="716" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">B. 工具调用请求</text><text x="600" y="747" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">调用指定 Python 函数</text><text x="600" y="778" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">例：faq_lookup_tool</text><rect x="825" y="680" width="320" height="128" rx="20" fill="#fff5e3" stroke="#b88a3d" stroke-width="2"/><text x="985" y="716" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">C. 最终答复</text><text x="985" y="747" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">没有要继续的工具 / 交接</text><text x="985" y="778" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">Runner 返回本轮结果</text><path d="M600 808 V862" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="440" y="862" width="320" height="100" rx="20" fill="#f1f4f3" stroke="#acbcb5" stroke-width="2"/><text x="600" y="898" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">本地执行，取得结果</text><text x="600" y="929" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">将工具结果加入记录</text><path d="M215 808 V1040" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M600 962 V1040" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="90" y="1040" width="670" height="125" rx="20" fill="#e9f6f0" stroke="#167361" stroke-width="2"/><text x="425" y="1076" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">仍有后续处理：继续循环</text><text x="425" y="1107" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">交接后用新 Agent 配置；工具后带上工具结果</text><text x="425" y="1138" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">下一次经过蓝色框，才再增加 1 次模型请求</text><path d="M90 1100 H25 V382 H370" stroke="#167361" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="70" y="350" font-size="21" fill="#167361" font-weight="700" text-anchor="start">再次请求模型</text><path d="M985 808 V865" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="825" y="865" width="320" height="100" rx="20" fill="#fff5e3" stroke="#b88a3d" stroke-width="2"/><text x="985" y="901" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">入口显示结果与事件</text><text x="985" y="932" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">本轮问题完成</text><path d="M985 965 V1020" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="825" y="1020" width="320" height="145" rx="20" fill="#f1f4f3" stroke="#acbcb5" stroke-width="2"/><text x="985" y="1056" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">保存接续信息</text><text x="985" y="1087" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">items = 对话历史</text><text x="985" y="1118" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">current_agent = last_agent</text><text x="985" y="1149" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">记录请求次数</text><path d="M985 1165 V1225" stroke="#90a39b" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="825" y="1225" width="320" height="96" rx="20" fill="#f1f4f3" stroke="#acbcb5" stroke-width="2"/><text x="985" y="1261" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">等待你的下一题</text><text x="985" y="1292" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">没有自动继续请求模型</text><rect x="90" y="1225" width="670" height="96" rx="20" fill="#eaf1ff" stroke="#3a80db" stroke-width="2"/><text x="425" y="1261" font-size="25" fill="#182e3b" font-weight="700" text-anchor="middle">行李例子：3 次都经过同一个蓝色框</text><text x="425" y="1292" font-size="21" fill="#52656e" font-weight="400" text-anchor="middle">Triage 决定交接 → FAQ 请求工具 → FAQ 据结果答复</text><text x="600" y="1370" font-size="22" fill="#52656e" font-weight="400" text-anchor="middle">工具执行 / Agent 切换 / 终端显示：本身都不等于一次模型请求。</text><text x="600" y="1404" font-size="22" fill="#52656e" font-weight="400" text-anchor="middle">下一题从最后的 Agent 接续；输入 exit 结束程序。</text></g></svg>