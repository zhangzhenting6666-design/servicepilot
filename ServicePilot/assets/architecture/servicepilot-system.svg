<text x="343" y="1236" font-size="27" font-weight="650" text-anchor="middle" class="mono">lookup_faq(query)</text>
<text x="343" y="1269" font-size="23" font-weight="400" text-anchor="middle" style="fill:#5b7180">查询政策，返回状态与依据</text>
