<text x="913" y="1197" font-size="22" font-weight="400" text-anchor="middle" style="fill:#5b7180">04  Python 查询工具</text>
<text x="913" y="1236" font-size="26" font-weight="650" text-anchor="middle" class="mono">query_order(order_id)</text>
<text x="913" y="1269" font-size="23" font-weight="400" text-anchor="middle" style="fill:#5b7180">规范编号，查询当前模拟记录</text>
