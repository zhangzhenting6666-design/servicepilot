<text x="64" y="85" font-size="49" font-weight="750" text-anchor="start">ServicePilot｜完整运行架构</text>
<text x="66" y="132" font-size="26" font-weight="400" text-anchor="start" style="fill:#5b7180">从用户提问，到有依据的回答：界面 → 会话 → Agent → 工具与数据 → 页面</text>
<rect x="66" y="152" width="182" height="40" rx="20" fill="#e1f1ea" stroke="#e1f1ea" stroke-width="2"/>
<text x="157.0" y="180" font-size="21" font-weight="600" text-anchor="middle" style="fill:#147e70">本机已实现</text>
<text x="270" y="180" font-size="23" font-weight="400" text-anchor="start" style="fill:#5b7180">模拟电商售后 Demo · 逻辑职责分层</text>
<rect x="144" y="222" width="984" height="130" rx="22" fill="#f4f0fa" stroke="#8868b4" stroke-width="2" filter="url(#shadow)"/>
<rect x="168" y="247" width="52" height="52" rx="15" fill="#8868b4" stroke="#8868b4" stroke-width="2"/>
<text x="194" y="283" font-size="28" font-weight="700" text-anchor="middle" style="fill:white">01</text>
<text x="240" y="275" font-size="33" font-weight="700" text-anchor="start" style="fill:#173347">Streamlit 聊天页面</text>
<text x="240" y="315" font-size="25" font-weight="400" text-anchor="start" style="fill:#5b7180">用户提问 / 客服答复 / 新会话 / 实际执行事件</text>
<path d="M636 352 V400" fill="none" stroke="#147e70" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="144" y="400" width="984" height="148" rx="22" fill="#f0f5ff" stroke="#346fce" stroke-width="2" filter="url(#shadow)"/>
<rect x="168" y="425" width="52" height="52" rx="15" fill="#346fce" stroke="#346fce" stroke-width="2"/>
<text x="194" y="461" font-size="28" font-weight="700" text-anchor="middle" style="fill:white">02</text>
<text x="240" y="453" font-size="33" font-weight="700" text-anchor="start" style="fill:#173347">Python 应用与会话</text>
<text x="240" y="493" font-size="25" font-weight="400" text-anchor="start" style="fill:#5b7180">历史消息 + 当前 Agent + 会话 / 请求标识</text>
<text x="240" y="527" font-size="25" font-weight="400" text-anchor="start" style="fill:#5b7180">缺信息先追问；同会话补充接续；新会话重建上下文</text>
<path d="M636 548 V594" fill="none" stroke="#147e70" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="112" y="594" width="1048" height="520" rx="22" fill="white" stroke="#98bcb2" stroke-width="2" filter="url(#shadow)"/>
<text x="148" y="643" font-size="34" font-weight="700" text-anchor="start" style="fill:#147e70">03  OpenAI Agents SDK / Runner</text>
<text x="148" y="683" font-size="25" font-weight="400" text-anchor="start" style="fill:#5b7180">请求模型 → 执行交接或工具 → 按需继续 → 返回本轮结果</text>
