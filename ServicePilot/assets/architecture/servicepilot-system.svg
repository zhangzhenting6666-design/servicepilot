<text x="1252" y="684" font-size="23" font-weight="400" text-anchor="start" style="fill:#346fce">远端模型：deepseek-flash</text>
<text x="1252" y="728" font-size="24" font-weight="400" text-anchor="start" style="fill:#5b7180">理解问题，选择交接或工具</text>
<text x="1252" y="765" font-size="24" font-weight="400" text-anchor="start" style="fill:#5b7180">根据工具结果组织答复</text>
