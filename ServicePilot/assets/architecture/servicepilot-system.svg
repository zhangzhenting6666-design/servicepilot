<text x="240" y="1703" font-size="25" font-weight="400" text-anchor="start" style="fill:#5b7180">本轮结束后等待用户下一条输入</text>
<path d="M144 1650 H80 V287 H144" fill="none" stroke="#147e70" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="44" y="1190" font-size="23" font-weight="600" style="fill:#147e70" transform="rotate(-90 44 1190)">回到界面，继续下一轮对话</text>
