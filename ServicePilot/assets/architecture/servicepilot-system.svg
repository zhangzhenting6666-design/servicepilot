<text x="913" y="1024" font-size="24" font-weight="400" text-anchor="middle" style="fill:#5b7180">追问编号，查询订单与物流</text>
<text x="636" y="1094" font-size="23" font-weight="400" text-anchor="middle" style="fill:#147e70">专员切换：先返回 Triage，再交给另一位专员</text>
