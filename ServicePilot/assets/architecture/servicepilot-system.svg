<text x="1252" y="432" font-size="24" font-weight="400" text-anchor="start" style="fill:#5b7180">API 密钥仅在服务端</text>
<text x="1252" y="469" font-size="24" font-weight="400" text-anchor="start" style="fill:#5b7180">当前由终端隐藏输入</text>
