<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="2110" viewBox="0 0 1680 2110" role="img" aria-labelledby="title desc">
<title id="title">ServicePilot 模拟电商售后系统完整运行架构</title>
<desc id="desc">用户界面、会话、SDK Runner和三种Agent、本地工具、模拟JSON、答复返回；右侧为模型服务、运行配置、实际事件和业务边界。当前本机已实现，公网部署与新栏目待实现。</desc>
<defs>
 <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1b3d31" flood-opacity="0.035"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L8.5,5 L1,9" fill="none" stroke="#147e70" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="sidearrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L8.5,5 L1,9" fill="none" stroke="#7c93a0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>text {font-family:'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif; fill:#173347;} .muted{fill:#5b7180;} .small{font-size:22px;} .body{font-size:25px;} .head{font-size:32px;font-weight:700;} .mono{font-family:'Cascadia Code',Consolas,'Microsoft YaHei',monospace;}</style>
