<text x="624" y="770" font-size="34" font-weight="700" text-anchor="middle">Triage Agent</text>
<text x="624" y="810" font-size="25" font-weight="400" text-anchor="middle" style="fill:#5b7180">识别请求，交给对应专员</text>
<path d="M490 843 V892 H343 V936" fill="none" stroke="#147e70" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
